name: Økonomibrief

on:
  push:
    paths:
      - 'brief.py'
  schedule:
    # Fire faste UTC-tidspunkter dekker 08:00 og 20:00 norsk tid gjennom sommer- og vintertid.
    # Python velger riktig lokale utgave basert på hvilken cron som utløste kjøringen.
    - cron: "5 6 * * *"
    - cron: "5 7 * * *"
    - cron: "5 18 * * *"
    - cron: "5 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - id: gen
        run: python brief.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          SCHEDULE: ${{ github.event.schedule || '' }}
      - if: steps.gen.outputs.new == 'true'
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add docs
          git commit -m "Ny utgave" && git push
      - if: steps.gen.outputs.new == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: steps.gen.outputs.new == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
